name: Build YuKang Desktop Installers

on:
  workflow_dispatch:
    inputs:
      knowledge_download_url:
        description: Optional direct URL to knowledge-package.zip for a full RAG build
        required: false
        default: ""
      build_macos:
        description: Build macOS packages too
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install build dependencies
        working-directory: desktop
        run: npm ci --no-audit --no-fund
      - name: Install host Electron runtime
        working-directory: desktop
        run: npm run install:electron
      - name: Build Linux packages
        working-directory: desktop
        env:
          KNOWLEDGE_DOWNLOAD_URL: ${{ inputs.knowledge_download_url }}
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
        run: |
          if [ -n "$KNOWLEDGE_DOWNLOAD_URL" ]; then
            mkdir -p knowledge/full
            curl -L --fail --retry 3 "$KNOWLEDGE_DOWNLOAD_URL" -o knowledge/knowledge-package.zip
            unzip -q knowledge/knowledge-package.zip -d knowledge/full
            echo "YUKANG_KNOWLEDGE_DB=$GITHUB_WORKSPACE/desktop/knowledge/full/knowledge_index.db" >> "$GITHUB_ENV"
          else
            echo "YUKANG_ALLOW_LITE_INDEX=1" >> "$GITHUB_ENV"
          fi
          npm run dist:linux
      - name: Smoke test Linux package
        working-directory: desktop
        run: |
          xvfb-run -a env YUKANG_DESKTOP_SMOKE=1 YUKANG_DESKTOP_PORT=32121 YUKANG_DESKTOP_DATA_DIR="$RUNNER_TEMP/yukang-linux-smoke" ./artifacts/linux-unpacked/YuKangClinic --no-sandbox

  macos:
    if: ${{ inputs.build_macos }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install build dependencies
        working-directory: desktop
        run: npm ci --no-audit --no-fund
      - name: Install host Electron runtime
        working-directory: desktop
        run: npm run install:electron
      - name: Build macOS packages
        working-directory: desktop
        env:
          KNOWLEDGE_DOWNLOAD_URL: ${{ inputs.knowledge_download_url }}
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          if [ -n "$KNOWLEDGE_DOWNLOAD_URL" ]; then
            mkdir -p knowledge/full
            curl -L --fail --retry 3 "$KNOWLEDGE_DOWNLOAD_URL" -o knowledge/knowledge-package.zip
            unzip -q knowledge/knowledge-package.zip -d knowledge/full
            echo "YUKANG_KNOWLEDGE_DB=$GITHUB_WORKSPACE/desktop/knowledge/full/knowledge_index.db" >> "$GITHUB_ENV"
          else
            echo "YUKANG_ALLOW_LITE_INDEX=1" >> "$GITHUB_ENV"
          fi
          npm run dist:mac
